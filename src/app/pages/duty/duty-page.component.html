<main class="workspace">
        @if (screen.error() && screen.editor() !== 'create') { <p class="error" role="alert">{{ screen.error() }}</p> }
        @if (screen.peopleError()) {
          <p class="error" role="alert">{{ screen.peopleError() }}</p>
        }

          <noah-page-heading [title]="screen.dutyPageTitle(screen.openedDuty())" [breadcrumbs]="screen.breadcrumbs()" />
          <div class="page-heading-details">
              @if (screen.dutyCount() !== null) { <p>{{ screen.dutyCount() }} 筆</p> }
          </div>
          <app-duty-board [kind]="screen.openedDuty()" [people]="screen.people()" [listTick]="screen.dutyListTick()" [routeView]="screen.dutyView()" [routeId]="screen.dutyRecordId()" (editing)="screen.dutyEditing.set($event)" (recordCount)="screen.dutyCount.set($event)" />
    </main>
    @if (screen.message()) {
      <p class="toast" role="status">{{ screen.message() }}</p>
    }
