@if (screen.restoreTarget(); as employee) {
  <noah-dialog [open]="true" mode="content" eyebrow="人資管理" title="恢復登入帳號" [closeOnBackdrop]="!screen.saving()" (closed)="screen.closeRestore()">
    <p>會保留 {{ employee.displayName }} 的員工資料，重設登入初始密碼並重新啟用帳號；若原帳號不存在，才會建立新帳號。</p>
    @if (screen.error()) { <p class="employee-dialog__error" role="alert">{{ screen.error() }}</p> }
    <form id="restore-employee-form" [formGroup]="screen.restoreForm" (ngSubmit)="screen.confirmRestore()">
      <div class="employee-dialog__body u-grid">
        <noah-field>身分證字號
          <input noahInput formControlName="nationalId" maxlength="10" autocomplete="off" spellcheck="false" required>
        </noah-field>
        <noah-field>新登入初始密碼
          <input noahInput formControlName="initialPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
          <span class="hint">至少 12 個字元，首次登入時需更改。</span>
        </noah-field>
      </div>
    </form>
    <div noahDialogActions class="employee-dialog__actions">
      <noah-button type="button" message="恢復登入帳號" (click)="screen.confirmRestore()" [disabled]="screen.restoreForm.invalid || screen.saving()"></noah-button>
      <noah-button type="button" variant="secondary" message="取消" (click)="screen.closeRestore()" [disabled]="screen.saving()"></noah-button>
    </div>
  </noah-dialog>
}
