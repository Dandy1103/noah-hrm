@switch (screen.access()) {
  @case ('loading') {
    <main class="u-grid u-place-center u-min-h-40vh u-text-secondary" role="status">正在確認人資權限…</main>
  }
  @case ('signed-out') {
    <main class="u-mx-auto u-w-full u-max-w-720 u-px-lg u-pt-xl u-pb-xl">
      <section class="panel">
        @if (screen.signInError === 'unavailable') {
          <p class="error" role="alert">目前無法連線到登入服務，請稍後再試。</p>
        } @else {
          <p class="error" role="alert">登入未完成，請再試一次。</p>
        }
        <a class="text-link" [href]="screen.loginUrl">重新登入</a>
      </section>
    </main>
  }
  @case ('denied') {
    <main class="u-mx-auto u-w-full u-max-w-720 u-px-lg u-pt-xl u-pb-xl">
      <section class="panel"><p>請用有人資權限的帳號登入。</p></section>
    </main>
  }
  @case ('unavailable') {
    <noah-dialog [open]="true" mode="alert" title="無法讀取權限" [message]="screen.accessError()" confirmLabel="重新整理" [showClose]="false" [closeOnBackdrop]="false" (confirmed)="screen.reloadPage()" />
  }
  @case ('allowed') {
    <router-outlet />
  }
}
