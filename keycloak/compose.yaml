name: noah-hrm-local

services:
  hrm-db:
    image: postgres:17
    environment:
      POSTGRES_DB: noah_hrm
      POSTGRES_USER: noah_hrm
      POSTGRES_PASSWORD: ${HRM_DB_PASSWORD:?Set the local HRM database password}
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "noah_hrm", "-d", "noah_hrm"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - noah-hrm-db:/var/lib/postgresql/data

  keycloak:
    build:
      context: ..
      dockerfile: keycloak/Dockerfile
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: http://localhost:8082
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set the local Keycloak admin password}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set the local OIDC client secret}
      KEYCLOAK_DEMO_PASSWORD: ${KEYCLOAK_DEMO_PASSWORD:?Set the local employee password}
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - noah-hrm-keycloak-data:/opt/keycloak/data
      - ./import:/opt/keycloak/data/import:ro

volumes:
  noah-hrm-db:
  noah-hrm-keycloak-data:
